name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['internot-ai-v0.4/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Wrap the web app as an Android app
        run: |
          mkdir build && cd build
          npm init -y
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          mkdir www && cp -r ../internot-ai-v0.4/. www/
          rm -f www/sw.js www/README.md www/tools-build-map.mjs
          npx cap init "Internot AI" org.internot.app --web-dir www
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          P='<uses-permission android:name="android.permission.'
          sed -i "s#<application#${P}CAMERA\"/>${P}ACCESS_FINE_LOCATION\"/>${P}ACCESS_COARSE_LOCATION\"/>${P}WAKE_LOCK\"/>${P}CHANGE_WIFI_MULTICAST_STATE\"/><uses-feature android:name=\"android.hardware.camera\" android:required=\"false\"/><application#" $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*; do cp www/icon-512.png $d/ic_launcher.png; cp www/icon-512.png $d/ic_launcher_round.png; rm -f $d/ic_launcher_foreground.png; done
          npx cap sync android
          cat $M
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk internot-ai.apk
          ls -la internot-ai.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest internot-ai.apk --title "Internot AI for Android" --notes "Install this APK on an Android phone. It works with no internet."
